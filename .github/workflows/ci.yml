name: ci
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.1.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bun run check:biome && bun run check
  test-build:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.1.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bash .github/scripts/check.sh
  hygiene:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.1.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: SKIP=no-commit-to-branch,biome bunx --no-install prek run --all-files --hook-stage manual
  required:
    name: ci / required
    if: always()
    needs:
    - quality
    - test-build
    - hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
    - uses: edbfi/automation/actions/gate@v4.1.0
      with:
        needs: ${{ toJSON(needs) }}
        required: quality test-build hygiene
