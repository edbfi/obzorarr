name: Repair CI recovery
run-name: >-
  ${{ inputs.pr-number && format('Repair CI #{0} {1}', inputs.pr-number, inputs.expected-head-sha) || 'Reconcile repair CI' }}
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [ci, Biome repair]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Exact repaired PR; empty reconciles recent repairs
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired commit
        type: string
        default: ''
      expected-base-sha:
        description: Exact default branch
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: repair-ci-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
          enable-cache: false
      - run: uv --version && python --version
      - uses: edbfi/automation/actions/ci-recovery@v3.0.1
        with:
          token: ${{ github.token }}
