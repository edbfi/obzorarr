<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="dark">
		<title>Something went wrong</title>
	</head>
	<body>
		<!-- SvelteKit's last resort, when even the error page fails: it can't know the viewer's
		language or load the app's styles, so it says it in both languages. -->
		<main>
			<h1>Something went wrong</h1>
			<p>Something went wrong. Try again.</p>
			<h1 lang="da">Noget gik galt</h1>
			<p lang="da">Noget gik galt. Prøv igen.</p>
		</main>
	</body>
</html>
